name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: gofmt check
        run: test -z "$(gofmt -l .)"
      - name: go vet
        run: go vet ./...
      - name: staticcheck
        # setup-go pins GOTOOLCHAIN=local; the analysis tools need a newer
        # toolchain than go.mod, so fetch it for these steps only.
        run: GOTOOLCHAIN=auto go run honnef.co/go/tools/cmd/staticcheck@v0.8.1 ./...
      - name: go test -race
        run: go test -race ./...
      - name: govulncheck
        run: GOTOOLCHAIN=auto go run golang.org/x/vuln/cmd/govulncheck@latest ./...
