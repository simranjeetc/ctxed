version: 2

project_name: ctxed

before:
  hooks:
    - go mod tidy

builds:
  - id: ctxed
    main: ./cmd/ctxed
    binary: ctxed
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X github.com/simranjeetc/ctxed/internal/cli.version={{.Version}}

archives:
  - id: ctxed
    formats: [tar.gz]
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    files:
      - skills/**/*
      - LICENSE
      - README.md

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"

release:
  # Publish install.sh as a release asset so it is reachable at
  # .../releases/latest/download/install.sh.
  extra_files:
    - glob: ./install.sh
